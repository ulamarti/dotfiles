# Color support
set -g default-terminal "$TERM"
set -ga terminal-overrides ",$TERM:RGB"
set-environment -g COLORTERM "truecolor"

# Quick actions
set -s escape-time 0

# start cnt 1
set -g base-index 1

# Auto rename
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Unbind prefix
unbind C-b

# Remap prefix
set -g prefix 'C-a'

# Split window
bind C-h split-window -v
bind C-v split-window -h

# New window
bind -n C-n new-window

# Switch windows
bind -n C-y prev
bind -n C-u next

# Navigate panes
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes
bind -n M-h resize-pane -L 10
bind -n M-j resize-pane -D 10
bind -n M-k resize-pane -U 10
bind -n M-l resize-pane -R 10

# Swap pane
bind -n M-d swap-pane -D
bind -n M-u swap-pane -U

# Session list
bind -n C-s choose-session

# Kill panes / window
bind -n C-q kill-pane

# Kill server
bind C-q kill-server

# VI like
setw -g mode-keys vi

# Copy mode
bind C-c copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Border pane color
set -g pane-border-style "fg=#5F5E5F"
set -g pane-active-border-style "fg=#5F5E5F"

# Status bar
set -g status on
set -g status-position top
set -g status-right ""
set -g status-left ""
set -g status-style "fg=#5F5E5F"
set -g message-style "fg=#CC241D"
set -g mode-style "bg=#303030"
